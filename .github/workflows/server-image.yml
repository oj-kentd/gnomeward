name: Publish Unraid server image
on:
  push:
    tags: ['server-v*']
permissions:
  contents: write
concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:combos
      - run: npm run test:combos-coop
      - run: npm run test:berry-combo
  browser:
    name: Browser checks (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [coop, motion, readiness, combos, berry, traits, layout, secrets, shop, shop-coop, splash, tumble]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and verify container
        shell: bash
        env:
          CHECK_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#server-v}"
          ACTUAL=$(node --input-type=module -e "import {SERVER_VERSION} from './server/config.js'; process.stdout.write(SERVER_VERSION)")
          test "$VERSION" = "$ACTUAL"
          docker build -f Dockerfile.server -t "gnomeward-server:$VERSION" .
          docker run -d --name gnomeward-image-check -e ALLOWED_ORIGINS=http://127.0.0.1:5175 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --mount type=volume,target=/data -p 127.0.0.1:2567:2567 "gnomeward-server:$VERSION"
          trap 'docker logs gnomeward-image-check; docker rm -fv gnomeward-image-check' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:2567/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:2567/healthz
          curl -fsS http://127.0.0.1:2567/readyz
          VITE_MULTIPLAYER_URL=http://127.0.0.1:2567 npm run build
          npm run preview -- --host 127.0.0.1 --port 5175 > /tmp/gnomeward-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5175/ > /dev/null; then break; fi
            sleep 1
          done
          export PLAYTEST_URL=http://127.0.0.1:5175
          case "$CHECK_GROUP" in
            coop)
              SERVER_URL=http://127.0.0.1:2567 npm run test:server-browser
              npm run test:coop
              ;;
            motion) npm run test:coop-motion-browser ;;
            readiness) npm run test:coop-ready-browser ;;
            combos) npm run test:combos-browser ;;
            berry) npm run test:berry-combo-browser ;;
            traits) npm run test:traits-browser ;;
            layout) npm run test:layout-browser ;;
            shop) npm run test:shop-browser ;;
            shop-coop) npm run test:shop-coop-browser ;;
            tumble) npm run test:tumble-shop-browser ;;
            splash) npm run test:splash ;;
            secrets)
              npm run test:strawberry
              npm run test:echoes
              ;;
            *) exit 1 ;;
          esac
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.group }}
          path: playtest-results/
          retention-days: 7
          if-no-files-found: ignore
  image:
    needs: [gameplay, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package verified source
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#server-v}"
          docker build -f Dockerfile.server -t "gnomeward-server:$VERSION" .
          mkdir -p release
          docker save "gnomeward-server:$VERSION" | gzip > "release/gnomeward-server-$VERSION-linux-amd64.tar.gz"
          cd release
          sha256sum "gnomeward-server-$VERSION-linux-amd64.tar.gz" > SHA256SUMS
      - name: Publish download and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS --title "Gnomeward server ${GITHUB_REF_NAME#server-v}" --notes-file deploy/RELEASE_NOTES.md
